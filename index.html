<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta
      name="description"
      content="Afterglow is a private, native iOS EPUB reading app built for calm, focused reading."
    >
    <meta property="og:title" content="Afterglow">

      property="og:description"
      content="A private, native iOS EPUB reader for calm, focused reading."
    >
    <meta property="og:type" content="website">
    <title>Afterglow - Download</title>
    <link rel="icon" href="/favicon/favicon.ico" sizes="any" media="(prefers-color-scheme: light)">
    <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
    <link rel="icon" href="/favicon/favicon-white.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="/favicon/favicon-96x96.png" type="image/png" sizes="96x96" media="(prefers-color-scheme: light)">
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/favicon/site.webmanifest">
    <link rel="preconnect" href="https://apps.apple.com">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="temp-site">
    <main aria-label="Afterglow">
      <nav class="hero-tab" aria-label="Afterglow">
        <a class="hero-tab-icon" href="/" aria-label="Afterglow home">
          <img src="header-logo.svg" alt="" width="328" height="328" decoding="async">
        </a>
        <span class="hero-tab-download-shell">
          <a class="header-download hero-tab-download" href="https://apps.apple.com/us/app/afterglow-epub-reader/id6767642581" aria-label="Download Afterglow on the App Store">
            <span class="hero-tab-download-label" aria-hidden="true">
              <span></span>
              <span>Download free</span>
            </span>
            <span class="hero-tab-qr" aria-hidden="true">
              <img src="qr-code.svg" alt="" width="300" height="300" decoding="async">
              <span>Scan to download</span>
            </span>
          </a>
        </span>
      </nav>
      <section class="temp-main" aria-label="Download Afterglow">
        <div class="temp-app-lockup">
          <h1 class="temp-headline">Your books, in their own light.</h1>
          <p class="temp-subtitle">Afterglow gives every book its own atmosphere, so stories feel less like files and more like spaces.</p>
        </div>
      </section>

      <section class="reader-showcase" aria-label="Reading themes" data-reader-showcase>
        <div class="showcase-visual">
          <div class="device-aura" aria-hidden="true"></div>

          <div class="reader-device" data-reader-device></div>
          <div class="book-rail" aria-hidden="true" data-book-rail></div>

          <button class="reader-theme-toggle" type="button" data-reader-theme-toggle aria-label="Switch to dark reader">
            <span class="reader-theme-thumb" aria-hidden="true"></span>
            <span class="reader-theme-option" data-reader-theme="light" aria-hidden="true">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="3.5"></circle>
                <path d="M12 2.5v2M12 19.5v2M4.4 4.4l1.4 1.4M18.2 18.2l1.4 1.4M2.5 12h2M19.5 12h2M4.4 19.6l1.4-1.4M18.2 5.8l1.4-1.4"></path>
              </svg>
            </span>
            <span class="reader-theme-option" data-reader-theme="dark" aria-hidden="true">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8a8.5 8.5 0 1 0 11.3 11.3Z"></path>
              </svg>
            </span>
          </button>
        </div>
      </section>
    </main>

    <footer class="site-footer temp-footer">
      <span>Afterglow for iPhone</span>
      <a href="privacy.html">Privacy Policy</a>
    </footer>
    <script src="books/catalog.js" defer></script>
    <script src="script.js?v=20260812-2" defer></script>
  </body>
</html>
